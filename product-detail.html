<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Shopping - Product Detail</title>
    <!-- Bootstrap CSS -->
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Alert Container -->
    <div id="alert-container" class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 1060; width: auto; min-width: 300px;"></div>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <div class="logo-icon me-2">
                    <img src="assests/logo.png" alt="">
                </div>
                <span class="fw-bold fs-4"> <img src="assests/Minimal Shopping.png" alt=""></span>
            </a>
            <div class="ms-auto">
                <a href="login.html" class="text-dark fs-4">
                    <i class="bi bi-person"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- Product Detail Section -->
    <section class="py-5">
        <div class="container">
            <div class="row g-5">
                <!-- Product Image -->
                <div class="col-md-6">
                    <div class="product-detail-img-container shadow-sm rounded overflow-hidden">
                        <img id="product-detail-img" src="" alt="" class="img-fluid w-100">
                    </div>
                </div>
                <!-- Product Info -->
                <div class="col-md-6">
                    <div class="ps-md-4">
                        <span id="product-badge" class="badge bg-light text-dark border px-3 py-2 mb-3 rounded-pill">New!</span>
                        <h1 id="product-title" class="display-5 fw-bold mb-2">Loading...</h1>
                        <h2 id="product-price" class="text-brand fw-bold mb-4"></h2>
                        
                        <p id="product-brand" class="text-muted mb-4"></p>

                        <div class="product-features mb-4">
                            <ul id="product-features-list" class="list-unstyled text-muted">
                                <!-- Features will be loaded here -->
                            </ul>
                        </div>

                        <div class="size-selector mb-5">
                            <p class="fw-bold mb-3">Size</p>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-secondary size-btn active">XS</button>
                                <button class="btn btn-outline-secondary size-btn">S</button>
                                <button class="btn btn-outline-secondary size-btn">M</button>
                                <button class="btn btn-outline-secondary size-btn">L</button>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button id="add-to-cart-btn" class="btn btn-brand btn-lg rounded-pill py-3 fw-bold">Add to Cart</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-4 text-center text-muted border-top">
        <div class="container">
            <p class="mb-0">&copy; 2026 Minimal Shopping. All rights reserved.</p>
        </div>
    </footer>

    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
