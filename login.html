<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Shopping - Login</title>
    <!-- Bootstrap CSS -->
    <link href="./style/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./script/axios.min.js">
    <link rel="stylesheet" href="./style/style.css">
</head>
<body class="bg-light">

    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <div class="logo-icon me-2">
                    <img src="assests/logo.png" alt="">
                </div>
                <span class="fw-bold fs-4"> <img src="assests/Minimal Shopping.png" alt=""></span>
            </a>
            <div class="ms-auto">
                <a href="login.html" class="text-dark fs-4">
                    <i class="bi bi-person"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="py-5 d-flex align-items-center" style="min-height: calc(100vh - 160px);">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="login-card bg-white p-5 rounded-4 shadow-sm text-center">
                        <h2 class="fw-bold mb-2">Hello Again!</h2>
                        <p class="text-muted mb-5">Welcome Back You've Been Missed!</p>
                        
                        <form>
                            <div class="mb-4 text-start">
                                <label class="form-label fw-bold small">Email Address</label>
                                <div class="input-group border-bottom">
                                    <input type="email" class="form-control border-0 bg-transparent px-0" placeholder="Enter your email">
                                    <span class="input-group-text border-0 bg-transparent text-brand">
                                        <i class="bi bi-eye-slash"></i>
                                    </span>
                                </div>
                            </div>
                            
                            <div class="mb-4 text-start">
                                <label class="form-label fw-bold small">Password</label>
                                <div class="input-group border-bottom">
                                    <input type="password" class="form-control border-0 bg-transparent px-0" placeholder="Enter your password">
                                    <span class="input-group-text border-0 bg-transparent text-brand">
                                        <i class="bi bi-eye-slash"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="mb-5 text-start">
                                <div class="form-check">
                                    <input class="form-check-input custom-checkbox" type="checkbox" id="rememberMe" checked>
                                    <label class="form-check-label small fw-bold" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>
                            </div>

                            <div class="d-grid">
                                <!-- <button type="submit" class="btn btn-brand-outline rounded-pill py-3 fw-bold">Login</button> -->

                                <a type="submit" class="btn btn-brand-outline rounded-pill py-3 fw-bold" href="https://chungdoi.com/templates/florence-brown/demo">Login</a>

                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-4 text-center text-muted border-top bg-white">
        <div class="container">
            <p class="mb-0">&copy; 2026 Minimal Shopping. All rights reserved.</p>
        </div>
    </footer>

    <script src="./script/bootstrap.min.js"></script>
    <script src="./script/script.js"></script>
</body>
</html>
