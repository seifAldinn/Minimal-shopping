<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Shopping - All Products</title>
    <!-- Bootstrap CSS -->
    <link href="./style/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Axios -->
    <script src="./script/axios.min.js"></script>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body class="bg-light">

    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <div class="logo-icon me-2">
                    <img src="assests/logo.png" alt="">
                </div>
                <span class="fw-bold fs-4"> <img src="assests/Minimal Shopping.png" alt=""></span>
            </a>
            <div class="ms-auto">
                <a href="login.html" class="text-dark fs-4">
                    <i class="bi bi-person"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- All Products Header -->
    <section class="py-5 bg-white border-bottom">
        <div class="container">
            <h1 class="text-center fw-bold mb-0 fs-1">All Products</h1>
        </div>
    </section>

    <!-- Products Grid -->
    <section class="py-5">
        <div class="container">
            <div id="all-products-row" class="row g-4">
                <!-- Products will be loaded here dynamically -->
            </div>
            <div class="text-center mt-5">
                <button id="show-more-btn" class="btn btn-brand rounded-pill px-5 py-2 fw-bold">Show More</button>
            </div>
        </div>
    </section>

    <footer class="py-4 text-center text-muted border-top bg-white">
        <div class="container">
            <p class="mb-0">&copy; 2026 Minimal Shopping. All rights reserved.</p>
        </div>
    </footer>

    <script src="./script/bootstrap.min.js"></script>
    <script src="./script/script.js"></script>
</body>
</html>
